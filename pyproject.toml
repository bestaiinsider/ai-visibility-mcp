[project]
name = "ai-visibility-mcp"
version = "0.3.0"
description = "MCP server for auditing AI-bot visibility, robots.txt, Cloudflare AI defaults, and brand mentions in LLM answers."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kris Sanders" }]
license = { text = "MIT" }
dependencies = [
    "fastmcp>=0.4.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
ai-visibility-mcp = "ai_visibility_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_visibility_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
